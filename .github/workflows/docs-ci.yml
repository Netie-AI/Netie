name: docs-ci

# Gate for the constitution repo: laptop-ASCII, required files, and patched
# public product tests (constructor node --test, OpenVault routing pytest).
# GitHub docs-ci on main was green through 8eb2d18. a8e895b failed when
# sibling tests cloned live HEAD; clones now pin measured SHAs.
# Local `make ci` is the same command.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  governed-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Governed docs gate
        run: |
          python3 -m compileall -q scripts netie
          python3 scripts/check_docs.py
