name: docs-ci

# Gate for the constitution repo: laptop-ASCII on governed markdown, required files present.
# Does not claim product CI (Cortex/DMS/OpenVault) is green.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  governed-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Governed docs gate
        run: |
          python3 -m compileall -q scripts netie
          python3 scripts/check_docs.py
