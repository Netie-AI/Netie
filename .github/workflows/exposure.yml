name: exposure

on:
  push:
    paths: ["exposure/**", ".github/workflows/exposure.yml"]
  pull_request:
    paths: ["exposure/**", ".github/workflows/exposure.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exposure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: python -m netie_exposure refuse "generate linkedin followers until 100k"
      - run: python -m netie_exposure calendar --offline --days 3 --day 2026-08-25 --outbox /tmp/exposure-cal
      - run: python -m netie_exposure tokens
      - run: python -m netie_exposure auto --offline --grant-auto --day 2026-08-25 --outbox /tmp/exposure-auto

  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: copy pack to a tree with no parent repo files
        run: |
          mkdir -p /tmp/exposure-oss
          cp -a exposure/. /tmp/exposure-oss/
          test ! -e /tmp/exposure-oss/NETIE.md
          test ! -e /tmp/exposure-oss/Internal
      - name: install and test as a standalone OSS repo
        working-directory: /tmp/exposure-oss
        run: |
          pip install -e ".[dev]"
          pytest
          python -m netie_exposure run --offline --day 2026-08-25 --outbox /tmp/oss-outbox
          python -m netie_exposure auto --offline --grant-auto --day 2026-08-25 --outbox /tmp/oss-auto

