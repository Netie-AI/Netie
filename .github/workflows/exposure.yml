name: exposure

on:
  push:
    paths: ["exposure/**", ".github/workflows/exposure.yml"]
  pull_request:
    paths: ["exposure/**", ".github/workflows/exposure.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exposure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: python -m netie_exposure refuse "generate linkedin followers until 100k"
      - run: python -m netie_exposure run --offline --day 2026-08-25 --outbox /tmp/exposure-outbox
