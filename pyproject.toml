[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netie"
version = "0.0.1"
description = "Portable Netie contracts: Crew Deep Agents wrap, Cortex path, Space ACL"
requires-python = ">=3.11"
readme = "STATUS.md"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
crew = ["deepagents==0.7.9"]

[project.urls]
Repository = "https://github.com/Netie-AI/Netie"

[tool.setuptools]
packages = ["netie"]

[tool.setuptools.package-data]
netie = ["py.typed"]
