[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netie-exposure"
version = "0.1.0"
description = "Open-source Cortex-crew marketing pack: organic LinkedIn/Reddit/GitHub drafts. No fake followers."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Netie.AI" }]

[project.scripts]
netie-exposure = "netie_exposure.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netie_exposure = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
